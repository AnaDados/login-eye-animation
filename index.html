<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Animado</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="avatar-container">
            <div class="avatar">
                <div class="avatar-head">
                    <div class="eyes-container">
                        <div class="eye">
                            <div class="pupil"></div>
                        </div>
                        <div class="eye">
                            <div class="pupil"></div>
                        </div>
                    </div>
                </div>
                <div class="hands">
                    <div class="hand"></div>
                    <div class="hand"></div>
                </div>
            </div>
        </div>

        <div class="login-form">
            <div class="welcome-text">
                <h2>Bem-vindo(a)!</h2>
                <p>Faça login para continuar</p>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="exemplo@dominio.com" autocomplete="email">
                </div>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
                    <i class="fas fa-eye-slash password-toggle" id="toggle-password"></i>
                </div>
            </div>

            <div class="options">
                <div class="remember-me">
                    <input type="checkbox" id="remember-me">
                    <label for="remember-me">Lembrar-me</label>
                </div>
                <a href="#" class="forgot-password">Esqueci a senha</a>
            </div>

            <button class="signin-btn">Entrar</button>

            <div class="separator">
                <span>ou continue com</span>
            </div>

            <div class="social-login">
                <button class="social-btn">
                    <i class="fab fa-google"></i>
                    Google
                </button>
                <button class="social-btn">
                    <i class="fab fa-github"></i>
                    GitHub
                </button>
            </div>

            <div class="create-account">
                Não tem conta? <a href="#">Crie uma agora</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
